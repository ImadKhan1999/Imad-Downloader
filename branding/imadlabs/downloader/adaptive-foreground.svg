<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ImadLabs app icon (hyper-downloader). Edit the "glyph" group to customise the symbol.
       The "background" group is swapped out automatically for iOS (full bleed) and Android adaptive layers. -->
  <defs>
    <linearGradient id="cobalt" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="740" y2="760">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="280" y1="250" x2="760" y2="820">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="100%" stop-color="#00D285"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background"></g>
  <g id="glyph">
    <!-- Download arrow -->
    <path d="M 512 300 L 512 600" fill="none" stroke="url(#cobalt)" stroke-width="88" stroke-linecap="round"/>
    <path d="M 352 470 L 512 630 L 672 470" fill="none" stroke="url(#cobalt)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tray -->
    <path d="M 290 680 L 290 790 L 734 790 L 734 680" fill="none" stroke="url(#mint)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- ImadLabs quantum dot (brand signature) -->
    <circle cx="760" cy="250" r="46" fill="#00FFC2" filter="url(#glow)"/>
    <circle cx="760" cy="250" r="20" fill="#FFFFFF"/>
  </g>
</svg>
