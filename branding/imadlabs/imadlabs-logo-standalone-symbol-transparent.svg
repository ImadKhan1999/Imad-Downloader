<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><g transform="translate(106, 85) scale(1.5)">
    <defs>
        <!-- Facet Gradients -->
        <linearGradient id="lux_top" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        <linearGradient id="lux_left" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0B1930"/>
        </linearGradient>
        <linearGradient id="lux_right" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066FF"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        
        <!-- L-Conduit Gradient -->
        <linearGradient id="lux_l_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00FFC2"/>
            <stop offset="50%" stop-color="#00F5A0"/>
            <stop offset="100%" stop-color="#00D285"/>
        </linearGradient>

        <!-- Ambient Glow Filter -->
        <filter id="lux_mint_glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="lux_dot_pulse" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="9" result="pulse"/>
            <feComposite in="SourceGraphic" in2="pulse" operator="over"/>
        </filter>
    </defs>

    <g id="hexacore-master-luxury">
        <!-- 3D Shadow Base Elevation -->
        <polygon points="100,126 180,80 180,170 100,216 20,170 20,80" fill="none" opacity="0.15"/>

        <!-- Top Facet (Data Ingress Diamond) -->
        <polygon points="100,20 180,66 100,112 20,66" fill="url(#lux_top)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" stroke-linejoin="round"/>
        
        <!-- Left Facet (Structural Mass) -->
        <polygon points="20,74 100,120 100,212 20,166" fill="url(#lux_left)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" stroke-linejoin="round"/>
        
        <!-- Right Facet (Forward Velocity Plane) -->
        <polygon points="100,120 180,74 180,166 100,212" fill="url(#lux_right)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" stroke-linejoin="round"/>

        <!-- Recessed Quantum Well / Aperture on Top Facet -->
        <polygon points="100,48 146,74 100,100 54,74" fill="#040813" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1.5"/>

        <!-- The Quantum Dot of the 'i' with Multilayer Aura -->
        <circle cx="100" cy="74" r="18" fill="#00F5A0" opacity="0.25" filter="url(#lux_dot_pulse)"/>
        <circle cx="100" cy="74" r="14" fill="#00FFC2" filter="url(#lux_mint_glow)"/>
        <circle cx="100" cy="74" r="7" fill="#FFFFFF"/>

        <!-- The Kinetic 'L' Energy Pathway (Descent + Sweep) -->
        <!-- Outer Neon Aura -->
        <path d="M 100 120 L 100 182 L 152 152" 
              stroke="url(#lux_l_grad)" 
              stroke-width="13" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              fill="none" 
              filter="url(#lux_mint_glow)"/>
              
        <!-- Inner Specular Conduit Core -->
        <path d="M 100 123 L 100 180 L 150 151" 
              stroke="#FFFFFF" 
              stroke-width="4.5" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              fill="none" 
              opacity="0.9"/>

        <!-- Kinetic Satellite Tip -->
        <circle cx="152" cy="152" r="5.5" fill="#00FFC2"/>
        <circle cx="152" cy="152" r="2.5" fill="#FFFFFF"/>
    </g>
    </g></svg>